name: Bug report
description: Create a report to help us improve Apex Optimizer
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the problem clearly.
  - type: input
    id: os
    attributes:
      label: Windows Version & Architecture
      placeholder: e.g. Windows 11 Pro 64-bit (Build 22631)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
