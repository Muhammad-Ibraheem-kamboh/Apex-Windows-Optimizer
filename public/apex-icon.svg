<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 120 744 745" width="512" height="512" fill="none">
  <defs>
    <!-- Soft outer glow for subtle depth -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.32"/>
    </filter>

    <!-- Left Wing: Electric Violet to Periwinkle Blue -->
    <linearGradient id="leftWingGrad" x1="170" y1="840" x2="520" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.96"/>
      <stop offset="42%" stop-color="#5B6CF9" stop-opacity="0.90"/>
      <stop offset="78%" stop-color="#6B8DFB" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#A8B8FF" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Left Wing Inner Specular Highlight -->
    <linearGradient id="leftHighlightGrad" x1="210" y1="780" x2="500" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#E0E7FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Right Wing: Sky Blue to Luminous Electric Cyan -->
    <linearGradient id="rightWingGrad" x1="504" y1="150" x2="855" y2="845" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CC4FA" stop-opacity="0.90"/>
      <stop offset="35%" stop-color="#489AF8" stop-opacity="0.88"/>
      <stop offset="72%" stop-color="#38D4F5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#5FF2FA" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Right Wing Inner Specular Highlight -->
    <linearGradient id="rightHighlightGrad" x1="525" y1="165" x2="825" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A5F3FC" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Top Overlapping Glass Petal -->
    <linearGradient id="apexPetalGrad" x1="512" y1="130" x2="512" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Upper Frosted Chevron Arch -->
    <linearGradient id="upperArchGrad" x1="160" y1="780" x2="864" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.88"/>
      <stop offset="28%" stop-color="#818CF8" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#F0F9FF" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#67E8F9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38E4F8" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Lower Depth Chevron Arch -->
    <linearGradient id="lowerArchGrad" x1="170" y1="840" x2="854" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B46E8" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.84"/>
    </linearGradient>

    <!-- Rim Stroke Left -->
    <linearGradient id="leftRim" x1="152" y1="855" x2="512" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#E0E7FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Rim Stroke Right -->
    <linearGradient id="rightRim" x1="512" y1="130" x2="872" y2="855" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="55%" stop-color="#E0F2FE" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#A5F3FC" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Arch Rim Stroke -->
    <linearGradient id="archRim" x1="160" y1="840" x2="864" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#A5F3FC" stop-opacity="0.50"/>
    </linearGradient>

    <!-- Tapered Specular Crest Gradient -->
    <linearGradient id="crestFade" x1="250" y1="706" x2="774" y2="706" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E0F2FE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#softGlow)">
    <!-- 1. Left Main Wing -->
    <path d="M 512 130
             C 374 188, 232 496, 152 855
             C 208 862, 266 842, 326 786
             C 402 686, 462 508, 512 342
             C 536 272, 536 196, 512 130 Z"
          fill="url(#leftWingGrad)"
          stroke="url(#leftRim)"
          stroke-width="4"
          stroke-linejoin="round"/>

    <!-- Left Wing Inner Glass Facet -->
    <path d="M 505 152
             C 392 222, 272 492, 194 812
             C 242 786, 286 736, 332 664
             C 398 548, 456 408, 502 276
             C 514 232, 514 186, 505 152 Z"
          fill="url(#leftHighlightGrad)"/>

    <!-- 2. Right Main Wing -->
    <path d="M 512 130
             C 650 188, 792 496, 872 855
             C 816 862, 758 842, 698 786
             C 622 686, 562 508, 512 342
             C 488 272, 488 196, 512 130 Z"
          fill="url(#rightWingGrad)"
          stroke="url(#rightRim)"
          stroke-width="4"
          stroke-linejoin="round"/>

    <!-- Right Wing Inner Glass Facet -->
    <path d="M 519 152
             C 632 222, 752 492, 830 812
             C 782 786, 738 736, 692 664
             C 626 548, 568 408, 522 276
             C 510 232, 510 186, 519 152 Z"
          fill="url(#rightHighlightGrad)"/>

    <!-- 3. Overlapping Apex Glass Petal -->
    <path d="M 512 130
             C 536 196, 536 272, 512 342
             C 488 272, 488 196, 512 130 Z"
          fill="url(#apexPetalGrad)"
          stroke="#FFFFFF"
          stroke-opacity="0.55"
          stroke-width="2.5"/>

    <!-- 4. Lower Translucent Depth Chevron Arch -->
    <path d="M 152 855
             C 246 720, 384 612, 512 544
             C 640 612, 778 720, 872 855
             C 806 862, 742 826, 676 768
             C 618 716, 564 666, 512 630
             C 460 666, 406 716, 348 768
             C 282 826, 218 862, 152 855 Z"
          fill="url(#lowerArchGrad)"
          stroke="#93C5FD"
          stroke-opacity="0.35"
          stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- 5. Upper Frosted Glass Speed Chevron Arch -->
    <path d="M 152 855
             C 234 686, 366 562, 512 486
             C 658 562, 790 686, 872 855
             C 784 744, 650 638, 512 562
             C 374 638, 240 744, 152 855 Z"
          fill="url(#upperArchGrad)"
          stroke="url(#archRim)"
          stroke-width="3.5"
          stroke-linejoin="round"/>

    <!-- 6. Smoothly Tapered Specular Crest Line -->
    <path d="M 250 726 C 338 624, 430 538, 512 489 C 594 538, 686 624, 774 726"
          stroke="url(#crestFade)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>