<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" width="1200" height="1020" fill="none">
  <defs>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.22"/>
    </filter>

    <linearGradient id="leftWingGrad" x1="170" y1="840" x2="520" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D4AFF" stop-opacity="0.98"/>
      <stop offset="42%" stop-color="#4F5FF5" stop-opacity="0.94"/>
      <stop offset="78%" stop-color="#5B7FF8" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#8FA4FF" stop-opacity="0.94"/>
    </linearGradient>

    <linearGradient id="leftHighlightGrad" x1="210" y1="780" x2="500" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#E0E7FF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.60"/>
    </linearGradient>

    <linearGradient id="rightWingGrad" x1="504" y1="150" x2="855" y2="845" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EB3F8" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#2D88F5" stop-opacity="0.90"/>
      <stop offset="72%" stop-color="#1EC8EE" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#2AE3F2" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="rightHighlightGrad" x1="525" y1="165" x2="825" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A5F3FC" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="apexPetalGrad" x1="512" y1="130" x2="512" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.24"/>
    </linearGradient>

    <linearGradient id="upperArchGrad" x1="160" y1="780" x2="864" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D4AFF" stop-opacity="0.90"/>
      <stop offset="28%" stop-color="#6366F1" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#22D3EE" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="lowerArchGrad" x1="170" y1="840" x2="854" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.86"/>
    </linearGradient>

    <linearGradient id="leftRim" x1="152" y1="855" x2="512" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.80"/>
      <stop offset="55%" stop-color="#C7D2FE" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="rightRim" x1="512" y1="130" x2="872" y2="855" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#BAE6FD" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="archRim" x1="160" y1="840" x2="864" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="crestFade" x1="250" y1="706" x2="774" y2="706" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E0F2FE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Centered Emblem -->
  <g transform="translate(178, 16) scale(0.825)" filter="url(#softGlow)">
    <path d="M 512 130 C 374 188, 232 496, 152 855 C 208 862, 266 842, 326 786 C 402 686, 462 508, 512 342 C 536 272, 536 196, 512 130 Z"
          fill="url(#leftWingGrad)" stroke="url(#leftRim)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 505 152 C 392 222, 272 492, 194 812 C 242 786, 286 736, 332 664 C 398 548, 456 408, 502 276 C 514 232, 514 186, 505 152 Z"
          fill="url(#leftHighlightGrad)"/>
    <path d="M 512 130 C 650 188, 792 496, 872 855 C 816 862, 758 842, 698 786 C 622 686, 562 508, 512 342 C 488 272, 488 196, 512 130 Z"
          fill="url(#rightWingGrad)" stroke="url(#rightRim)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 519 152 C 632 222, 752 492, 830 812 C 782 786, 738 736, 692 664 C 626 548, 568 408, 522 276 C 510 232, 510 186, 519 152 Z"
          fill="url(#rightHighlightGrad)"/>
    <path d="M 512 130 C 536 196, 536 272, 512 342 C 488 272, 488 196, 512 130 Z"
          fill="url(#apexPetalGrad)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5"/>
    <path d="M 152 855 C 246 720, 384 612, 512 544 C 640 612, 778 720, 872 855 C 806 862, 742 826, 676 768 C 618 716, 564 666, 512 630 C 460 666, 406 716, 348 768 C 282 826, 218 862, 152 855 Z"
          fill="url(#lowerArchGrad)" stroke="#93C5FD" stroke-opacity="0.40" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 152 855 C 234 686, 366 562, 512 486 C 658 562, 790 686, 872 855 C 784 744, 650 638, 512 562 C 374 638, 240 744, 152 855 Z"
          fill="url(#upperArchGrad)" stroke="url(#archRim)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 250 726 C 338 624, 430 538, 512 489 C 594 538, 686 624, 774 726"
          stroke="url(#crestFade)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Light-Mode High-Contrast Wordmark -->
  <text x="600" y="886" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Inter', sans-serif" font-size="94" letter-spacing="8">
    <tspan font-weight="800" fill="#0A0B0D">APEX</tspan>
    <tspan font-weight="500" fill="#5B616E" dx="10">OPTIMIZER</tspan>
  </text>
</svg>
